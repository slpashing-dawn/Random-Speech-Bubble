<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🎨 포스트잇 위젯 생성기 (정렬 수정)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f8f6f0;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    padding: 2rem 1rem;
    color: #2c2418;
  }
  .container {
    max-width: 1600px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.8rem;
    align-items: start;
  }
  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
  
  .form-panel {
    background: white;
    border-radius: 2rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    padding: 1.4rem;
    border: 1px solid #ece5d8;
    max-height: 90vh;
    overflow-y: auto;
  }
  .form-group { margin-bottom: 1rem; }
  label { font-weight: 600; font-size: 0.8rem; display: block; margin-bottom: 0.2rem; color: #4a3e2c; }
  input, textarea, select {
    width: 100%;
    padding: 0.4rem 0.7rem;
    border: 1px solid #ddd0b6;
    border-radius: 1rem;
    font-size: 0.8rem;
    background: #fffdf9;
  }
  .section-title {
    font-size: 1rem;
    font-weight: 700;
    margin: 1.2rem 0 0.8rem 0;
    border-left: 3px solid #f5b642;
    padding-left: 0.7rem;
  }
  button {
    background: #2c2418;
    color: white;
    border: none;
    padding: 0.35rem 0.9rem;
    border-radius: 2rem;
    font-weight: 500;
    cursor: pointer;
    transition: 0.2s;
    margin-right: 0.4rem;
    margin-top: 0.2rem;
    font-size: 0.75rem;
  }
  button:hover { opacity: 0.85; transform: scale(0.97); }
  .character-item {
    background: #fef9ef;
    border-radius: 1rem;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border: 1px solid #ece0cc;
  }
  .flex-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .color-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
  }
  .color-item {
    background: #fef9ef;
    padding: 0.4rem;
    border-radius: 1rem;
  }
  .color-item label { font-size: 0.7rem; margin-bottom: 0.1rem; }
  .color-item input { padding: 0.2rem; height: 2rem; }
  
  .result-panel {
    background: #2c2418;
    border-radius: 2rem;
    padding: 1rem;
    color: #f0e6d8;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }
  pre {
    background: #1f1a10;
    padding: 0.8rem;
    border-radius: 1rem;
    overflow-x: auto;
    font-size: 0.7rem;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 40vh;
  }
  .preview-container {
    background: #4a3e2c;
    border-radius: 1.2rem;
    padding: 0.6rem;
    position: relative;
    min-height: 300px;
  }
  iframe {
    width: 100%;
    background: #fef9ef;
    border-radius: 0.8rem;
    border: none;
    display: block;
    min-height: 400px;
  }
  .copy-btn, .download-btn { background: #f5b642; color: #2c2418; border: none; padding: 0.3rem 0.8rem; border-radius: 2rem; font-size: 0.7rem; margin-left: 0.3rem; }
  hr { margin: 0.8rem 0; border-color: #5a4e38; }
  small { font-size: 0.7rem; color: #cbbf9a; }
  .badge { background: #e6dfc7; color: #4a3e2c; padding: 0.1rem 0.4rem; border-radius: 1rem; font-size: 0.7rem; }
  .time-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-top: 0.3rem;
    flex-wrap: wrap;
  }
  .time-row input { width: 60px; }
  .comment-list {
    margin-top: 0.5rem;
    padding-left: 0.5rem;
    border-left: 2px dotted #e0cfb0;
  }
  .comment-item {
    background: #fff6e8;
    border-radius: 0.8rem;
    padding: 0.4rem;
    margin-bottom: 0.4rem;
  }
  .comment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.2rem;
  }
  .comment-text-area {
    width: 100%;
    margin-bottom: 0.3rem;
  }
  .collapse-header {
    cursor: pointer;
    user-select: none;
  }
  .collapse-icon {
    font-size: 0.9rem;
    margin-right: 0.4rem;
  }
  .character-design {
    background: #fff3e0;
    border-radius: 0.8rem;
    padding: 0.4rem;
    margin-top: 0.5rem;
  }
  /* 체크박스 그룹: 강제 한 줄, 좌측 정렬 */
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.5rem 0 1rem 0;
    flex-wrap: nowrap;
  }
  .checkbox-group label {
    margin-bottom: 0;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .checkbox-group input {
    width: auto;
    margin: 0;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="container">
  <!-- 좌측 패널 -->
  <div class="form-panel">
    <h2>📌 포스트잇 위젯 생성기 (중립 버전)</h2>
    <p style="margin-bottom:1rem; font-size:0.8rem;">캐릭터별 디자인, 시간대별 코멘트 설정 → 미리보기 + HTML 생성</p>

    <div class="section-title">⚙️ 기본 동작</div>
    <div class="form-group"><label>🎲 등장 확률 (%)</label><input type="number" id="prob" value="33" min="0" max="100" step="1"></div>
    <div class="form-group"><label>⏱️ 자동 닫힘 시간 (초, 0=안 닫힘)</label><input type="number" id="autoDelay" value="8" min="0" max="60" step="1"></div>
    <div class="checkbox-group">
      <input type="checkbox" id="oncePerSession" checked>
      <label>✨ 한 번 표시되면 세션 중 다시 안 뜸</label>
    </div>

    <div class="section-title">📍 공통 위치</div>
    <div class="form-group"><label>위치</label>
      <select id="position">
        <option value="bottom-right">우측 하단</option><option value="bottom-left">좌측 하단</option>
        <option value="top-right">우측 상단</option><option value="top-left">좌측 상단</option>
      </select>
    </div>
    <div class="form-group"><label>📏 포스트잇 기본 너비 (px)</label><input type="number" id="globalWidth" value="260" step="10" min="200" max="400"></div>

    <div class="section-title">👥 캐릭터 목록 (디자인 + 코멘트)</div>
    <div id="charactersContainer"></div>
    <button id="addCharacterBtn" style="background:#f5b642; color:#2c2418;">➕ 캐릭터 추가</button>
    <hr>
    <small>※ 각 캐릭터는 디자인(배경, 글자색 등)을 독립적으로 가집니다.<br>
    코멘트별로 시간대를 설정할 수 있으며, 시간대가 없으면 항상 등장 가능.<br>
    "다른 코멘트 보기" 버튼은 전체 활성 코멘트 중에서 랜덤 출력 (캐릭터 변경 가능).</small>
  </div>

  <!-- 우측 패널 -->
  <div class="result-panel">
    <div class="preview-container">
      <div class="flex-between" style="margin-bottom:0.3rem;">
        <span>🖥️ 실시간 미리보기</span>
        <button id="testShowBtn" style="background:#f5b642; color:#2c2418;">🎲 강제 표시 테스트</button>
      </div>
      <iframe id="previewIframe" title="Preview" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
    </div>
    <div class="code-header">
      <strong>📋 생성된 HTML 코드</strong>
      <div><button id="copyCodeBtn" class="copy-btn">📋 복사</button><button id="downloadHtmlBtn" class="download-btn">⬇️ 저장</button></div>
    </div>
    <pre id="generatedCode"></pre>
    <small>💡 코드 복사 → 티스토리 스킨 HTML의 &lt;/body&gt; 앞에 붙여넣기</small>
  </div>
</div>

<script>
  // 중립적인 캐릭터 데이터
  let characters = [
    {
      name: "방문자",
      avatarUrl: "https://via.placeholder.com/60?text=Visitor",
      design: {
        noteBg: "#fffaec",
        textColor: "#3e3a2b",
        borderAccent: "#f5c542",
        nameColor: "#9b7e46"
      },
      comments: [
        { text: "잘 보고 갑니다~ 😊", useTimeRange: false, startHour: 0, endHour: 23 },
        { text: "오늘도 좋은 하루 되세요!", useTimeRange: false, startHour: 0, endHour: 23 },
        { text: "이런 글도 올려주셔서 감사해요.", useTimeRange: false, startHour: 0, endHour: 23 }
      ]
    },
    {
      name: "산책자",
      avatarUrl: "https://via.placeholder.com/60?text=Walker",
      design: {
        noteBg: "#e6f7f0",
        textColor: "#2c5a4a",
        borderAccent: "#5ca88a",
        nameColor: "#2c5a4a"
      },
      comments: [
        { text: "산책하다 들렀어요 🌿", useTimeRange: false, startHour: 0, endHour: 23 },
        { text: "편안한 공간이네요.", useTimeRange: false, startHour: 0, endHour: 23 },
        { text: "다음에도 올게요!", useTimeRange: false, startHour: 0, endHour: 23 }
      ]
    },
    {
      name: "별빛",
      avatarUrl: "https://via.placeholder.com/60?text=Starlight",
      design: {
        noteBg: "#fce4d6",
        textColor: "#8b3c1c",
        borderAccent: "#d97a3a",
        nameColor: "#8b3c1c"
      },
      comments: [
        { text: "반짝이는 글이네요 ✨", useTimeRange: false, startHour: 0, endHour: 23 },
        { text: "마음이 따뜻해져요.", useTimeRange: false, startHour: 0, endHour: 23 },
        { text: "좋은 에너지를 받아갑니다.", useTimeRange: false, startHour: 0, endHour: 23 }
      ]
    }
  ];

  // DOM 요소
  const charactersContainer = document.getElementById('charactersContainer');
  const addCharacterBtn = document.getElementById('addCharacterBtn');
  const previewIframe = document.getElementById('previewIframe');
  const generatedCodePre = document.getElementById('generatedCode');
  const copyBtn = document.getElementById('copyCodeBtn');
  const downloadBtn = document.getElementById('downloadHtmlBtn');
  const testShowBtn = document.getElementById('testShowBtn');

  const probInput = document.getElementById('prob');
  const autoDelayInput = document.getElementById('autoDelay');
  const oncePerSessionCheck = document.getElementById('oncePerSession');
  const positionSelect = document.getElementById('position');
  const globalWidthInput = document.getElementById('globalWidth');

  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }

  // 캐릭터 폼 렌더링 (접기 가능)
  function renderCharactersForm() {
    charactersContainer.innerHTML = '';
    characters.forEach((char, idx) => {
      const charDiv = document.createElement('div');
      charDiv.className = 'character-item';
      const collapsedKey = `char_collapsed_${idx}`;
      const isCollapsed = localStorage.getItem(collapsedKey) === 'true';
      charDiv.innerHTML = `
        <div class="flex-between collapse-header" data-charidx="${idx}" style="margin-bottom:0.5rem;">
          <div>
            <span class="collapse-icon">${isCollapsed ? '▶' : '▼'}</span>
            <strong>👤 ${escapeHtml(char.name)}</strong>
          </div>
          <button class="deleteCharBtn" data-idx="${idx}" style="background:#b91c1c; padding:0.2rem 0.6rem;">삭제</button>
        </div>
        <div class="char-details" style="display: ${isCollapsed ? 'none' : 'block'};">
          <div class="form-group"><label>이름</label><input type="text" class="char-name" value="${escapeHtml(char.name)}" data-idx="${idx}"></div>
          <div class="form-group"><label>아바타 URL</label><input type="text" class="char-avatar" value="${escapeHtml(char.avatarUrl)}" data-idx="${idx}"></div>
          
          <div class="character-design">
            <div style="font-weight:600; margin-bottom:0.3rem;">🎨 디자인 (이 캐릭터 전용)</div>
            <div class="color-grid" style="margin-bottom:0.5rem;">
              <div class="color-item"><label>포스트잇 배경</label><input type="color" class="char-noteBg" value="${char.design.noteBg}" data-idx="${idx}"></div>
              <div class="color-item"><label>글자색</label><input type="color" class="char-textColor" value="${char.design.textColor}" data-idx="${idx}"></div>
              <div class="color-item"><label>테두리 강조색</label><input type="color" class="char-borderAccent" value="${char.design.borderAccent}" data-idx="${idx}"></div>
              <div class="color-item"><label>이름/버튼 색상</label><input type="color" class="char-nameColor" value="${char.design.nameColor}" data-idx="${idx}"></div>
            </div>
          </div>
          
          <div class="comment-list">
            <div style="font-weight:600; font-size:0.75rem; margin-bottom:0.3rem;">💬 코멘트 목록 (시간대 설정 가능)</div>
            <div class="comments-container" data-idx="${idx}">
              ${char.comments.map((cmt, msgIdx) => `
                <div class="comment-item" data-msgidx="${msgIdx}">
                  <div class="comment-header">
                    <span>코멘트 ${msgIdx+1}</span>
                    <button class="deleteCommentBtn" data-charidx="${idx}" data-msgidx="${msgIdx}" style="background:#b91c1c; padding:0.1rem 0.5rem;">✖</button>
                  </div>
                  <textarea class="comment-text" rows="2" data-charidx="${idx}" data-msgidx="${msgIdx}" style="width:100%; margin-bottom:0.3rem;">${escapeHtml(cmt.text)}</textarea>
                  <div class="time-row">
                    <label><input type="checkbox" class="comment-useTime" data-charidx="${idx}" data-msgidx="${msgIdx}" ${cmt.useTimeRange ? 'checked' : ''}> 시간대 제한</label>
                    <input type="number" class="comment-startHour" data-charidx="${idx}" data-msgidx="${msgIdx}" value="${cmt.startHour}" min="0" max="23" style="width:60px;"> 시 ~
                    <input type="number" class="comment-endHour" data-charidx="${idx}" data-msgidx="${msgIdx}" value="${cmt.endHour}" min="0" max="23" style="width:60px;"> 시
                  </div>
                </div>
              `).join('')}
            </div>
            <button class="addCommentBtn" data-charidx="${idx}" style="background:#8b7a5c; margin-top:0.2rem;">+ 코멘트 추가</button>
          </div>
        </div>
      `;
      charactersContainer.appendChild(charDiv);
      
      const header = charDiv.querySelector('.collapse-header');
      const detailsDiv = charDiv.querySelector('.char-details');
      const iconSpan = header.querySelector('.collapse-icon');
      header.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        const nowCollapsed = detailsDiv.style.display !== 'block';
        detailsDiv.style.display = nowCollapsed ? 'block' : 'none';
        iconSpan.textContent = nowCollapsed ? '▼' : '▶';
        localStorage.setItem(`char_collapsed_${idx}`, !nowCollapsed);
      });
    });
    attachCharacterEvents();
  }

  function attachCharacterEvents() {
    document.querySelectorAll('.deleteCharBtn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.idx);
        characters.splice(idx, 1);
        renderCharactersForm();
        updateAll();
      });
    });
    document.querySelectorAll('.char-name').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = parseInt(inp.dataset.idx);
        characters[idx].name = inp.value;
        updateAll();
      });
    });
    document.querySelectorAll('.char-avatar').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = parseInt(inp.dataset.idx);
        characters[idx].avatarUrl = inp.value;
        updateAll();
      });
    });
    document.querySelectorAll('.char-noteBg').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = parseInt(inp.dataset.idx);
        characters[idx].design.noteBg = inp.value;
        updateAll();
      });
    });
    document.querySelectorAll('.char-textColor').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = parseInt(inp.dataset.idx);
        characters[idx].design.textColor = inp.value;
        updateAll();
      });
    });
    document.querySelectorAll('.char-borderAccent').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = parseInt(inp.dataset.idx);
        characters[idx].design.borderAccent = inp.value;
        updateAll();
      });
    });
    document.querySelectorAll('.char-nameColor').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const idx = parseInt(inp.dataset.idx);
        characters[idx].design.nameColor = inp.value;
        updateAll();
      });
    });
    document.querySelectorAll('.addCommentBtn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const charIdx = parseInt(btn.dataset.charidx);
        characters[charIdx].comments.push({ text: "새 코멘트", useTimeRange: false, startHour: 0, endHour: 23 });
        renderCharactersForm();
        updateAll();
      });
    });
    document.querySelectorAll('.deleteCommentBtn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const charIdx = parseInt(btn.dataset.charidx);
        const msgIdx = parseInt(btn.dataset.msgidx);
        characters[charIdx].comments.splice(msgIdx, 1);
        renderCharactersForm();
        updateAll();
      });
    });
    document.querySelectorAll('.comment-text').forEach(ta => {
      ta.addEventListener('input', (e) => {
        const charIdx = parseInt(ta.dataset.charidx);
        const msgIdx = parseInt(ta.dataset.msgidx);
        characters[charIdx].comments[msgIdx].text = ta.value;
        updateAll();
      });
    });
    document.querySelectorAll('.comment-useTime').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const charIdx = parseInt(cb.dataset.charidx);
        const msgIdx = parseInt(cb.dataset.msgidx);
        characters[charIdx].comments[msgIdx].useTimeRange = cb.checked;
        updateAll();
      });
    });
    document.querySelectorAll('.comment-startHour').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const charIdx = parseInt(inp.dataset.charidx);
        const msgIdx = parseInt(inp.dataset.msgidx);
        characters[charIdx].comments[msgIdx].startHour = parseInt(inp.value) || 0;
        updateAll();
      });
    });
    document.querySelectorAll('.comment-endHour').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const charIdx = parseInt(inp.dataset.charidx);
        const msgIdx = parseInt(inp.dataset.msgidx);
        characters[charIdx].comments[msgIdx].endHour = parseInt(inp.value) || 23;
        updateAll();
      });
    });
  }

  addCharacterBtn.addEventListener('click', () => {
    characters.push({
      name: "새 캐릭터", avatarUrl: "",
      design: { noteBg: "#fffaec", textColor: "#3e3a2b", borderAccent: "#f5c542", nameColor: "#9b7e46" },
      comments: [{ text: "샘플 코멘트입니다.", useTimeRange: false, startHour: 0, endHour: 23 }]
    });
    renderCharactersForm();
    updateAll();
  });

  function getPositionStyle(pos) {
    switch(pos) {
      case 'bottom-right': return 'bottom:20px; right:20px;';
      case 'bottom-left': return 'bottom:20px; left:20px;';
      case 'top-right': return 'top:20px; right:20px;';
      case 'top-left': return 'top:20px; left:20px;';
      default: return 'bottom:20px; right:20px;';
    }
  }

  function generateWidgetHTML() {
    const prob = parseInt(probInput.value) / 100;
    const autoHideSec = parseInt(autoDelayInput.value);
    const oncePerSession = oncePerSessionCheck.checked;
    const position = positionSelect.value;
    const positionStyle = getPositionStyle(position);
    const globalWidth = globalWidthInput.value;
    const charactersJson = JSON.stringify(characters);
    
    return `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  .postit-widget {
    position: fixed;
    ${positionStyle}
    z-index: 9999;
    transition: all 0.3s ease;
    opacity: 0;
    transform: translateX(30px);
    visibility: hidden;
  }
  .postit-widget.show {
    opacity: 1;
    transform: translateX(0);
    visibility: visible;
    animation: gentlePop 0.3s ease-out forwards;
  }
  @keyframes gentlePop {
    0% { transform: scale(0.9) translateX(20px); opacity: 0; }
    80% { transform: scale(1.02); }
    100% { transform: scale(1) translateX(0); opacity: 1; }
  }
  .postit-note {
    width: ${globalWidth}px;
    padding: 18px 16px 14px 20px;
    border-radius: 0 12px 12px 12px;
    box-shadow: 4px 6px 15px rgba(0,0,0,0.2), 0 1px 0 rgba(255,255,255,0.5) inset;
    position: relative;
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    border-left: 4px solid var(--borderAccent);
    background: var(--noteBg);
    color: var(--textColor);
  }
  .postit-note::before {
    content: '';
    position: absolute;
    bottom: -10px;
    right: 20px;
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 0 solid transparent;
    border-top: 12px solid var(--noteBg);
    filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.1));
  }
  .postit-text {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
    word-break: keep-all;
  }
  .postit-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }
  .character-token {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .char-img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: #e6dfc7;
    border: 2px solid var(--borderAccent);
  }
  .char-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--nameColor);
  }
  .action-buttons {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .refresh-btn, .pin-btn, .close-btn {
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    color: var(--nameColor);
    transition: 0.2s;
    padding: 0 4px;
  }
  .refresh-btn:hover, .pin-btn:hover, .close-btn:hover { color: #664e1c; }
  @media (max-width: 500px) {
    .postit-note { width: ${Math.min(220, globalWidth)}px; padding: 14px 12px; }
    .postit-text { font-size: 12px; }
    .char-img { width: 30px; height: 30px; }
  }
</style>
</head>
<body>
<div id="postitWidget" class="postit-widget">
  <div class="postit-note">
    <div class="postit-text" id="postitMessage">💬</div>
    <div class="postit-footer">
      <div class="character-token">
        <img id="postitAvatar" class="char-img" src="" alt="캐릭터">
        <span id="postitCharName" class="char-name">이름</span>
      </div>
      <div class="action-buttons">
        <button id="pinButton" class="pin-btn" title="고정/고정해제">📌</button>
        <button id="refreshComment" class="refresh-btn" title="다른 코멘트 보기">🔄</button>
        <button id="closePostit" class="close-btn" title="닫기">✖</button>
      </div>
    </div>
  </div>
</div>
<script>
  const charactersData = ${charactersJson};
  const CONFIG = {
    appearanceProbability: ${prob},
    autoHideDelay: ${autoHideSec * 1000},
    showOncePerSession: ${oncePerSession},
    defaultAvatar: "https://via.placeholder.com/60?text=?"
  };
  let alreadyShown = false;
  if (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('postit_shown') === 'true') alreadyShown = true;
  let currentCharacter = null;
  let currentComment = null;
  let autoHideTimer = null;
  let isPinned = false;
  
  function getAllActiveComments() {
    const now = new Date();
    const hour = now.getHours();
    const active = [];
    charactersData.forEach(char => {
      char.comments.forEach(cmt => {
        let timeOk = true;
        if (cmt.useTimeRange) {
          let start = cmt.startHour, end = cmt.endHour;
          if (start <= end) timeOk = (hour >= start && hour <= end);
          else timeOk = (hour >= start || hour <= end);
        }
        if (timeOk) {
          active.push({ character: char, comment: cmt.text });
        }
      });
    });
    return active;
  }
  
  function getRandomActiveComment() {
    const active = getAllActiveComments();
    if (active.length === 0) return null;
    const idx = Math.floor(Math.random() * active.length);
    return active[idx];
  }
  
  function applyCharacterAndComment(character, commentText) {
    if (!character) return;
    currentCharacter = character;
    currentComment = commentText;
    const msgEl = document.getElementById('postitMessage');
    const nameEl = document.getElementById('postitCharName');
    const avatarEl = document.getElementById('postitAvatar');
    const noteDiv = document.querySelector('.postit-note');
    if (msgEl) msgEl.innerText = commentText;
    if (nameEl) nameEl.innerText = character.name;
    if (avatarEl) {
      avatarEl.src = character.avatarUrl || CONFIG.defaultAvatar;
      avatarEl.onerror = () => { avatarEl.src = CONFIG.defaultAvatar; };
    }
    if (noteDiv) {
      noteDiv.style.setProperty('--noteBg', character.design.noteBg);
      noteDiv.style.setProperty('--textColor', character.design.textColor);
      noteDiv.style.setProperty('--borderAccent', character.design.borderAccent);
      noteDiv.style.setProperty('--nameColor', character.design.nameColor);
    }
  }
  
  function resetAutoHideTimer() {
    if (autoHideTimer) clearTimeout(autoHideTimer);
    if (!isPinned && CONFIG.autoHideDelay > 0) {
      autoHideTimer = setTimeout(() => hidePostit(), CONFIG.autoHideDelay);
    }
  }
  
  function showRandomPostit(force = false) {
    if (!force && CONFIG.showOncePerSession && alreadyShown) return;
    if (!force && Math.random() >= CONFIG.appearanceProbability) return;
    const activeItem = getRandomActiveComment();
    if (!activeItem) return;
    applyCharacterAndComment(activeItem.character, activeItem.comment);
    const widget = document.getElementById('postitWidget');
    if (widget) widget.classList.add('show');
    if (CONFIG.showOncePerSession && typeof sessionStorage !== 'undefined') sessionStorage.setItem('postit_shown', 'true');
    alreadyShown = true;
    isPinned = false;
    resetAutoHideTimer();
  }
  
  function refreshComment() {
    const activeItem = getRandomActiveComment();
    if (activeItem) {
      applyCharacterAndComment(activeItem.character, activeItem.comment);
      resetAutoHideTimer();
    }
  }
  
  function togglePin() {
    isPinned = !isPinned;
    const pinBtn = document.getElementById('pinButton');
    if (pinBtn) pinBtn.textContent = isPinned ? '📍' : '📌';
    if (isPinned) {
      if (autoHideTimer) clearTimeout(autoHideTimer);
    } else {
      resetAutoHideTimer();
    }
  }
  
  function hidePostit() {
    const widget = document.getElementById('postitWidget');
    if (widget) widget.classList.remove('show');
    if (autoHideTimer) clearTimeout(autoHideTimer);
    isPinned = false;
    const pinBtn = document.getElementById('pinButton');
    if (pinBtn) pinBtn.textContent = '📌';
  }
  
  document.getElementById('closePostit')?.addEventListener('click', (e) => { e.stopPropagation(); hidePostit(); });
  document.getElementById('refreshComment')?.addEventListener('click', (e) => { e.stopPropagation(); refreshComment(); });
  document.getElementById('pinButton')?.addEventListener('click', (e) => { e.stopPropagation(); togglePin(); });
  document.getElementById('postitWidget')?.addEventListener('click', (e) => {
    if (e.target === document.getElementById('refreshComment') || e.target === document.getElementById('closePostit') || e.target === document.getElementById('pinButton')) return;
    hidePostit();
  });
  window.showRandomPostit = showRandomPostit;
  window.addEventListener('load', () => setTimeout(() => showRandomPostit(false), 800));
<\/script>
</body>
</html>`;
  }

  function updateAll() {
    const fullHtml = generateWidgetHTML();
    generatedCodePre.innerText = fullHtml;
    const blob = new Blob([fullHtml], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    previewIframe.src = url;
    previewIframe.onload = () => URL.revokeObjectURL(url);
  }

  testShowBtn.addEventListener('click', () => {
    const win = previewIframe.contentWindow;
    if (win && win.showRandomPostit) {
      win.showRandomPostit(true);
    } else {
      alert('미리보기 로딩 후 다시 시도해주세요.');
    }
  });

  copyBtn.addEventListener('click', () => {
    const code = generatedCodePre.innerText;
    if (!code) return;
    if (navigator.clipboard) navigator.clipboard.writeText(code).catch(() => fallbackCopy(code));
    else fallbackCopy(code);
    function fallbackCopy(t) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('✅ 복사됨'); }
  });
  downloadBtn.addEventListener('click', () => {
    const code = generatedCodePre.innerText;
    if (!code) return;
    const blob = new Blob([code], {type: 'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'postit_widget.html';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  const inputs = [probInput, autoDelayInput, oncePerSessionCheck, positionSelect, globalWidthInput];
  inputs.forEach(inp => inp.addEventListener('input', updateAll));
  renderCharactersForm();
  updateAll();
</script>
</body>
</html>
